robot1/planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

robot1/global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: robot1/base_link
      robot_radius: 0.20 
      use_sim_time: False
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4 # Reduzido levemente para facilitar passagens
        cost_scaling_factor: 3.0

robot1/local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: robot1/base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["static_layer","inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 3.0

robot1/controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001 # Destrava movimento lateral lento
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.14 # Ignora orientação final já que não gira

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Velocidades aumentadas para 0.5 m/s
      min_vel_x: -0.0
      max_vel_x: 0.5
      min_vel_y: -0.5
      max_vel_y: 0.5
      max_vel_theta: 0.0 # Proibido girar
      min_speed_xy: 0.05
      max_speed_xy: 0.5
      
      # Acelerações para resposta rápida
      acc_lim_x: 2.5
      acc_lim_y: 2.5
      acc_lim_theta: 0.0
      decel_lim_x: -2.5
      decel_lim_y: -2.5
      
      # Amostragem densa para movimentos diagonais
      vx_samples: 25
      vy_samples: 25
      vtheta_samples: 0
      sim_time: 1.5
      linear_granularity: 0.02

      # Critics ajustados para Holonômico
      critics: ["Oscillation", "BaseObstacle", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathDist.scale: 10.0 # Reduzido para não ficar "preso" no trilho global
      GoalDist.scale: 25.0 # Aumentado para priorizar chegar ao destino
      Oscillation.scale: 1.0

robot1/behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"] # Readicione "spin" e "backup" aqui
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    robot_base_frame: robot1/base_link
    use_sim_time: False

robot1/bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: robot1/base_link
    odom_topic: /robot1/odom