# nav2_params.yaml - Configuração Limpa para Ativação do Mapa Global

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

amcl:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True

# Gerenciador de Ciclo de Vida de Localização (Gerencia Map Server)
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: True
    node_names: ['map_server', 'amcl'] 

# Gerenciador de Ciclo de Vida de Navegação (Desativado, mas presente para evitar erros)
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    node_names: [] # Lista vazia para desativar o gerenciamento de navegação

# --- Parâmetros de Neutralização de Componentes ---

amcl:
  ros__parameters:
    set_initial_pose: False 
    
map_server:
  ros__parameters:
    topic_name: "map" 
    
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [""]
      
global_costmap:
  global_costmap:
    ros__parameters:
      plugins: [""]