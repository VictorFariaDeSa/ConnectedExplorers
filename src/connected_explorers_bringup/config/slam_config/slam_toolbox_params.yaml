slam_toolbox:
  ros__parameters:
    use_sim_time: True 
    scan_topic: /scan
    odom_topic: /odom
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    mode: mapping          # Diga para ele "criar um mapa"
    map_update_interval: 1.0 # Atualiza o mapa no RViz a cada 1 segundo
    max_laser_range: 20.0    # Alcance máximo do seu LiDAR (em metros)